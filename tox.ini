[tox]
requires =
    tox >= 4.20
env_list =
    py313
    py312
    py311
    py310

[testenv]
basepython =
    py313: python3.13
    py312: python3.12
    py311: python3.11
    py310: python3.10
deps =
    pytest
    .[wxc,test,geobenchv2]
commands = pytest -s -v tests

[testenv:integration-tests-base-set-{py313,py312,py311}]
description = Run specific integration test function from test_base_set.py using Python {envname}
skip_install = true
allowlist_externals =
    git
    sh
passenv =
    TEST_BRANCH
    TEST_FUNCTION
    TERRATORCH_TMP_ROOT
setenv =
    TERRATORCH_BRANCH_DIR = {envtmpdir}/terratorch_branch
deps =
    pytest
commands =
    ; Clone terratorch branch and install
    sh -c "if [ -z \"$TEST_BRANCH\" ]; then TEST_BRANCH=main; fi && \
        rm -rf {env:TERRATORCH_BRANCH_DIR} && \
        git clone -b $TEST_BRANCH --single-branch https://github.com/terrastackai/terratorch.git {env:TERRATORCH_BRANCH_DIR} && \
        cd {env:TERRATORCH_BRANCH_DIR} && \
        if command -v uv >/dev/null 2>&1; then \
            uv pip install -e .[test]; \
        else \
            pip install -e .[test]; \
        fi"
    ; Run the test
    sh -c "cd {env:TERRATORCH_BRANCH_DIR} && pytest -s -v integrationtests/test_base_set.py::{env:TEST_FUNCTION}"

[testenv:integration-tests-vllm-release-{py313,py312,py311}]
description = Run Terratorch integration tests with vLLM (release) using Python {envname}
deps =
    pytest
    .[vllm,vllm_test]
commands = pytest -s -v integrationtests/vLLM

[testenv:integration-tests-vllm-main-{py313,py312,py311}]
description = Run Terratorch integration tests with vLLM (main) using Python {envname}
allowlist_externals =
    sh
    python
setenv =
    VLLM_USE_PRECOMPILED = 1
deps =
    pytest
    .[vllm,vllm_test]
commands =
    ; Check if precompiled wheel exists for the latest commit from GitHub, if not get the latest available wheel URL
    sh -c "WHEEL_ENV_FILE={envtmpdir}/vllm_wheel_env.sh python scripts/check_vllm_wheel.py"
    ; Install vLLM from git with wheel location if set (use uv if available, otherwise pip)
    sh -c "if [ -f {envtmpdir}/vllm_wheel_env.sh ]; then . {envtmpdir}/vllm_wheel_env.sh && rm -f {envtmpdir}/vllm_wheel_env.sh; fi && if command -v uv >/dev/null 2>&1; then uv pip install https://github.com/vllm-project/vllm.git; else pip install https://github.com/vllm-project/vllm.git; fi"
    ; Run integration tests
    pytest -s -v integrationtests/vLLM

[testenv:vllm-tests-tt-main-{py313,py312,py311}]
description = Run vLLM (main) io processor plugin with TerraTorch current branch using with Python {envname}
allowlist_externals =
    git
    sh
    python
setenv =
    VLLM_USE_PRECOMPILED = 1
    VLLM_SOURCE_DIR = {envtmpdir}/vllm
deps =
    pytest
    pytest-asyncio
    geobenchv2>=0.9
    impactmesh>0.1.0
    tblib
    .[vllm_test]
commands =
    ; Shallow clone vLLM repo
    git clone -b main --single-branch --depth 1 https://github.com/vllm-project/vllm.git {env:VLLM_SOURCE_DIR}
    ; Check if precompiled wheel exists for the latest commit, if not get the latest available wheel URL
    sh -c "VLLM_DIR={env:VLLM_SOURCE_DIR} WHEEL_ENV_FILE={envtmpdir}/vllm_wheel_env.sh python scripts/check_vllm_wheel.py"
    ; Install vLLM from checked out repo with wheel location if set (use uv if available, otherwise pip)
    sh -c "if [ -f {envtmpdir}/vllm_wheel_env.sh ]; then . {envtmpdir}/vllm_wheel_env.sh && rm -f {envtmpdir}/vllm_wheel_env.sh; fi && if command -v uv >/dev/null 2>&1; then uv pip install {env:VLLM_SOURCE_DIR} --force-reinstall; else pip install {env:VLLM_SOURCE_DIR} --force-reinstall; fi"
    ; Install the Prithvi IO Processor plugin from local clone
    sh -c "if command -v uv >/dev/null 2>&1; then uv pip install {env:VLLM_SOURCE_DIR}/tests/plugins/prithvi_io_processor_plugin; else pip install {env:VLLM_SOURCE_DIR}/tests/plugins/prithvi_io_processor_plugin; fi"
    ; Run vLLM prithvi plugin tests
    pytest -s -v {env:VLLM_SOURCE_DIR}/tests/plugins_tests/test_io_processor_plugins.py
    ; Cleanup: Remove vLLM source directory after tests
    sh -c "rm -rf {env:VLLM_SOURCE_DIR}"